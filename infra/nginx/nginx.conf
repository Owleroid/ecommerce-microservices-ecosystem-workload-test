events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstream for API Gateway (can add multiple instances here)
    upstream api_gateway {
        # When scaling, add more instances:
        # server api-gateway-1:3000;
        # server api-gateway-2:3000;
        # server api-gateway-3:3000;
        
        server api-gateway:3000;
        
        # Load balancing method (default is round-robin)
        # least_conn;  # Use least connections
        # ip_hash;     # Stick to same server based on client IP
    }

    # Rate limiting zone (10MB can store ~160,000 IPs)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # Request buffering
        client_max_body_size 10M;
        client_body_buffer_size 10M;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Headers to pass through
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Health check endpoint (bypass rate limiting)
        location /health {
            proxy_pass http://api_gateway;
        }

        # All other requests
        location / {
            # Apply rate limiting (burst allows temporary spikes)
            limit_req zone=api_limit burst=20 nodelay;
            
            # Status code for rate limit rejection
            limit_req_status 429;
            
            # Proxy to API Gateway
            proxy_pass http://api_gateway;
            
            # WebSocket support (if needed later)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Custom error pages
        error_page 429 /429.html;
        location = /429.html {
            internal;
            return 429 '{"error":{"message":"Too many requests from Nginx","statusCode":429}}';
            add_header Content-Type application/json;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            return 503 '{"error":{"message":"Service temporarily unavailable","statusCode":503}}';
            add_header Content-Type application/json;
        }
    }

    # Optional: Status page for monitoring
    server {
        listen 8080;
        location /nginx_status {
            stub_status;
            access_log off;
        }
    }
}

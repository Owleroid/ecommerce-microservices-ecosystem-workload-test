version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Note: In production, these would be separate containers
  # For testing, you can run the actual services separately
  # and point to them via environment variables

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      SERVICE_NAME: api-gateway
      PORT: 3000
      NODE_ENV: production
      INSTANCE_ID: gateway-1
      
      # Point to actual services (use docker network names or localhost)
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      MEDIA_SERVICE_URL: http://media-service:3003
      
      # Redis for rate limiting
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      
      # Rate limiting config
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX_REQUESTS: "100"
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
